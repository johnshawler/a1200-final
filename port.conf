# port.conf - describes this port to tools/port.sh and to CI. Shell syntax: no spaces around "=".
# The values below build and bench the unchanged kit skeleton, so the template passes as it comes.

NAME=game                                   # program name inside dist/
SOURCES="kit/sys.c kit/disp.c kit/perf.c kit/main.c"   # everything for the build line (.c, .s, .asm)
CFLAGS="-Ikit"                              # add -Isrc -Iassets as you need them

TICKS=500                                   # logic ticks for the bench: use 3000 or more for a real port
CLASS=planar                                # planar   = must hold 50 Hz: late=0 and worst_pct <= 80
                                            # perpixel = per-pixel game: reports shown_fps, no 50 Hz gate

HOST_TEST=""                                # host build of the logic, e.g. "src/host_test.c src/logic.c"
HOST_CFLAGS=""                              # e.g. "-Isrc". The host test is run as: host_test <TICKS>
                                            # and must print the game-state checksum as 8 hex digits.

EXPECT_CHECKSUM=00235400                    # only for the unchanged skeleton: delete this line in a real port
